[project]
name = "backy"
version = "0.1.0"
description = "Database backup sidecar: dump a sibling container's database to blob storage"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.30.0",
    "docker>=7.2.0",
    "httpx>=0.28",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=8.4",
    "testcontainers[azurite,postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli_level = "INFO"
# The suite starts real containers; nothing here is fast.
addopts = "-v --durations=5"

[tool.pyrefly]
project-includes = ["backy", "tests"]
