services:
  backy:
    build: .
    env_file: .env
    # Idle so Coolify's Scheduled Task can `docker exec` the actual run:
    #   uv run --no-sync python -m backy
    # Add --test-notify to that command to check the alert channels instead.
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    # The container just sleeps, so the only thing worth checking is what the scheduled
    # run needs: a reachable docker socket.
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import docker; docker.from_env().ping()"]
      interval: 1m
      timeout: 10s
      retries: 3
    volumes:
      # The databases to back up. Read-only: backy never writes it.
      # Coolify: skip this mount and paste the same JSON into a DATABASES_JSON env var
      # instead -- its compose file mounts have no content field.
      # Root-equivalent access to the host. This is the cost of the docker-exec approach,
      # and what buys you no database credentials over the network and no version-matched
      # pg_dump in the backy image.
      - /var/run/docker.sock:/var/run/docker.sock
      # Debounce state (NOTIFY_STATE_FILE) -- without this, failure alerts repeat every run.
      - backy-state:/state
volumes:
  backy-state:
